:root{

  --accent:#3A4BB0; --accent-ink:#FFFFFF; --accent-soft:#E3E6F8;
  --ok:#15803D; --ok-soft:#DCF3E3; --warn:#A8530A; --warn-soft:#FBEBD3; --crit:#B42318; --crit-soft:#FBE0DD;
  --nav:#161A2E; --nav-ink:#C9CEE6; --nav-on:#FFFFFF;
  --font:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){

    --bg:#0E1120; --surface:#171B2E; --surface2:#131728; --ink:#E7E9F5; --muted:#9AA1BB; --line:#2A3050;
    --accent:#8E9BFF; --accent-ink:#0E1330; --accent-soft:#232A55;
    --ok:#5BD58A; --ok-soft:#10301D; --warn:#F0A64A; --warn-soft:#3A2810; --crit:#FF8A7D; --crit-soft:#3C1713;
    --nav:#0A0D1B; --nav-ink:#9AA1BB; --nav-on:#FFFFFF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1120; --surface:#171B2E; --surface2:#131728; --ink:#E7E9F5; --muted:#9AA1BB; --line:#2A3050;
  --accent:#8E9BFF; --accent-ink:#0E1330; --accent-soft:#232A55;
  --ok:#5BD58A; --ok-soft:#10301D; --warn:#F0A64A; --warn-soft:#3A2810; --crit:#FF8A7D; --crit-soft:#3C1713;
  --nav:#0A0D1B; --nav-ink:#9AA1BB; --nav-on:#FFFFFF; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;margin:0;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:15px} h3{font-size:13px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.shell{display:grid;grid-template-columns:222px minmax(0,1fr);min-height:100vh}
.side{background:var(--nav);color:var(--nav-ink);padding:18px 12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;align-self:start}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;color:var(--nav-on);font-weight:700}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand svg{width:16px;height:16px;stroke:var(--accent-ink);fill:none;stroke-width:2.2}
.brand small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.12em;color:var(--nav-ink)}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--nav-ink);padding:9px 10px;border-radius:8px;text-align:left;font-weight:500}
nav button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav button:hover{background:rgba(255,255,255,.06);color:var(--nav-on)}
nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
nav button[hidden]{display:none}
.side-foot{margin-top:auto;font-size:12px;display:flex;flex-direction:column;gap:6px}
.side-foot button{border:1px solid rgba(255,255,255,.18);background:none;border-radius:8px;padding:6px 10px;color:var(--nav-ink);font-size:12px}

.main{min-width:0;display:flex;flex-direction:column}
.imp{position:sticky;top:0;z-index:30;background:#B45309;color:#fff;padding:9px max(16px,env(safe-area-inset-right,0px)) 9px max(20px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
.imp[hidden]{display:none}
.imp b{font-weight:700}
.imp button{margin-left:auto;border:1px solid rgba(255,255,255,.7);background:rgba(0,0,0,.18);color:#fff;border-radius:7px;padding:4px 12px;font-weight:600}
.topbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px max(20px,env(safe-area-inset-right,0px)) 12px max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.search{flex:1;min-width:180px;max-width:420px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:7px 12px}
.who{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.who label{font-size:12px;color:var(--muted)}
.who select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px}
.mfa{font-size:12px}
.content{padding:20px max(20px,env(safe-area-inset-right,0px)) 56px max(20px,env(safe-area-inset-left,0px));min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head p{margin:2px 0 0;color:var(--muted)}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.crumb button{border:0;background:none;color:var(--accent);padding:0;font-weight:600}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi span{font-size:12px;color:var(--muted);display:block}
.kpi strong{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:block;line-height:1.25;margin-top:2px}
.kpi small{font-size:12px;color:var(--muted)}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.split{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:start}
@media(max-width:1000px){.split{grid-template-columns:minmax(0,1fr)}}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 9px;font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--crit);color:var(--crit)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer} tr.row:hover td{background:var(--surface2)}
td.r,th.r{text-align:right}
.tn{font-weight:600}
.sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.meter{display:inline-block;width:60px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;vertical-align:middle;margin-right:6px}
.meter i{display:block;height:100%;background:var(--accent)} .meter.full i{background:var(--warn)}

.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list p{margin:0;font-size:12.5px;color:var(--muted)}
.fi{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--accent)} .fi.crit{background:var(--crit)} .fi.warn{background:var(--warn)}

.hl span{font-size:12px;color:var(--muted)}
.chart text{fill:var(--muted);font-size:10.5px;font-family:var(--font)}
.chart .gl{stroke:var(--line)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}

dl.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0;font-size:13px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

.perm{font-size:12.5px}
.perm td,.perm th{text-align:center;padding:7px 10px}
.perm td:first-child,.perm th:first-child{text-align:left}
.yes{color:var(--ok);font-weight:700}.no{color:var(--line)}

.ov{position:fixed;inset:0;background:rgba(8,10,22,.55);z-index:60;display:grid;place-items:center;padding:16px}
.ov[hidden]{display:none}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(100%,480px);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal p{margin:0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0}

.mbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.err{color:var(--crit);font-size:12.5px;min-height:18px}
.ban{background:var(--surface2);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--muted)}

</style>

function checkNames(s,secrets,loop,where,probs){
  var rest=s.replace(/\{\{\s*[a-zA-Z0-9_.]+\s*\}\}/g,"");
  if(rest.indexOf("{{")>-1||rest.indexOf("}}")>-1)probs.push(where+": a {{ or }} is not closed properly.");
  (s.match(/\{\{\s*[a-zA-Z0-9_.]+\s*\}\}/g)||[]).forEach(function(m){
    var n=m.replace(/[{}\s]/g,"");
    var okv=KV.indexOf(n)>-1||/^vars\.[1-9]\d?$/.test(n)||(loop&&(n==="item"||n==="index"))||(n.indexOf("secret.")===0&&secrets.indexOf(n.slice(7))>-1);
    if(!okv)probs.push(where+": unknown variable {{"+n+"}}"+(n.indexOf("secret.")===0?" (add that secret first)":"")+".")})}
function checkNode(x,where,secrets,loop,probs){
  if(typeof x==="string")checkNames(x,secrets,loop,where,probs);
  else if(Array.isArray(x))x.forEach(function(v,i){
    if(v&&typeof v==="object"&&"$each"in v){if(v["$each"]!=="vars"||!("do"in v))probs.push(where+"["+i+"]: $each needs the list name \"vars\" and a \"do\" part.");else checkNode(v["do"],where+"["+i+"].do",secrets,true,probs)}
    else if(v&&typeof v==="object"&&"$if"in v){if(!("then"in v))probs.push(where+"["+i+"]: $if needs a \"then\" part.");else checkNode(v.then,where+"["+i+"].then",secrets,loop,probs)}
    else checkNode(v,where+"["+i+"]",secrets,loop,probs)});
  else if(x&&typeof x==="object")Object.keys(x).forEach(function(k){if(/\{\{/.test(k))probs.push(where+": field names cannot contain variables.");checkNode(x[k],where+"."+k,secrets,loop,probs)})}
function checkProv(p){
  var probs=[],f=p.f;
  if(p.kind==="smtp"){var s=p.s;if(!s.host||/[ \/@]/.test(s.host))probs.push("host: enter a server name such as smtp.example.com.");if(!(s.port>=1&&s.port<=65535))probs.push("port: enter a number such as 587.");
    if(s.security==="none")probs.push("security: 'none' sends passwords in clear text and is not allowed.");if(s.from_email.indexOf("@")<1)probs.push("from address: enter a full email address.");return probs}
  var u=f.url.trim();
  if(!/^https:\/\//i.test(u))probs.push("url: only https:// addresses are allowed.");
  else{var m=/^https:\/\/([^\/?#]*)/i.exec(u),auth=m[1];
    if(auth.indexOf("@")>-1)probs.push("url: put credentials in a header, not in the address.");
    var pm=/:(\d+)$/.exec(auth);if(pm&&["443","8443"].indexOf(pm[1])<0)probs.push("url: only port 443 or 8443 is allowed.");
    if(/^(localhost|127\.|10\.|192\.168\.|169\.254\.|172\.(1[6-9]|2\d|3[01])\.)/i.test(auth.replace(/:\d+$/,"")))probs.push("url: private and internal addresses are refused.")}
  checkNames(u,p.secrets,false,"url",probs);
  f.headers.forEach(function(h){var k=h[0].trim();if(!k)return;
    if(!/^[A-Za-z0-9!#$%&'*+.^_`|~-]{1,64}$/.test(k)||FORBID.indexOf(k.toLowerCase())>-1)probs.push("header '"+k+"' is not allowed.");
    checkNames(h[1],p.secrets,false,"header "+k,probs)});
  try{checkNode(JSON.parse(f.body),"body",p.secrets,false,probs)}catch(e){probs.push("body: not valid JSON ("+String(e.message).replace(/^JSON\.parse: /,"").slice(0,80)+").")}
  if(!/^\s*\d{3}(\s*,\s*\d{3})*\s*$/.test(f.ok))probs.push("success statuses: list HTTP status numbers separated by commas, such as 200, 201.");
  if(f.hook.header&&p.secrets.indexOf(f.hook.secret)<0)probs.push("delivery reports: choose one of the stored secrets to verify them with.");
  return probs}

        for(var k in rng){if(n[k]!==null&&!(Number.isInteger(n[k])&&n[k]>=rng[k][0]&&n[k]<=rng[k][1])){$("#err").textContent="Use a whole number from "+rng[k][0]+" to "+rng[k][1]+" for "+k+".";return}}
        var ea=n.active!=null?n.active:tp.active,ei=n.idle!=null?n.idle:tp.idle;
        if(ei>ea){$("#err").textContent="The idle rate cannot be faster than the active rate.";return}
        if(JSON.stringify(n)===JSON.stringify(o)){$("#err").textContent="Nothing has changed.";return}
        c.ov=n;logA("framerate.camera.update",c.n,f.t.n,w);refreshHealth(f.t);closeModal();render();toast("Saved for "+c.n+".")});return}
  if((el=e.target.closest("[data-camreset]"))){
    var g=findCam(el.getAttribute("data-camreset"));
    mReason("Reset "+esc(g.c.n),"Removes every override. The camera follows the tenant's frame rate again.","Reset","",function(w){g.c.ov={mode:null,idle:null,active:null,fixed:null};logA("framerate.camera.reset",g.c.n,g.t.n,w);refreshHealth(g.t);closeModal();render();toast("Reset. "+g.c.n+" follows the tenant.")});return}
  if((el=e.target.closest("[data-camsrc]"))){
    var h=findCam(el.getAttribute("data-camsrc"));
    mReason("Stream address for "+esc(h.c.n),"The address the analysis worker pulls, with the camera's user name and password. It is stored encrypted and never shown again, only the host.","Save address",
      '<div class="field"><label for="srcUrl">RTSP address</label><input type="text" id="srcUrl" class="mono" autocomplete="off" placeholder="rtsp://user:password@10.20.0.14:554/Streaming/Channels/102"></div>',function(w){
        var u=$("#srcUrl").value.trim(),m=/^rtsps?:\/\/(?:[^@\s\/]+@)?([^\/\s:]+)(?::(\d{1,5}))?(?:\/\S*)?$/i.exec(u);
        if(!m){$("#err").textContent="Use an address like rtsp://user:password@host:554/path with no spaces.";return}
        h.c.host=m[1]+(m[2]?":"+m[2]:"");logA("camera.source.set",h.c.n,h.t.n,w);closeModal();render();toast("Address saved, encrypted. Only the host is shown.")});return}
});
