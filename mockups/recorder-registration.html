<title>Recorder Registration Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one centred column. Step 2 pairs "your app" on the left with a simulated recorder screen on the right. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface2:#F7F9F7; --ink:#14201E; --muted:#5C6B68; --line:#DAE1DD;
  --accent:#0F766E; --accent-ink:#FFFFFF; --accent-soft:#DDF1EE;
  --ok:#15803D; --ok-soft:#DCF3E3; --warn:#A8530A; --warn-soft:#FBEBD3; --crit:#B42318; --crit-soft:#FBE0DD;
  --font:'Schibsted Grotesk','Noto Sans Tamil',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1312; --surface:#141E1D; --surface2:#101918; --ink:#E5EEEC; --muted:#92A4A0; --line:#25332F;
    --accent:#3CC4B4; --accent-ink:#06211E; --accent-soft:#12302D;
    --ok:#5BD58A; --ok-soft:#10301D; --warn:#F0A64A; --warn-soft:#3A2810; --crit:#FF8A7D; --crit-soft:#3C1713; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1312; --surface:#141E1D; --surface2:#101918; --ink:#E5EEEC; --muted:#92A4A0; --line:#25332F;
  --accent:#3CC4B4; --accent-ink:#06211E; --accent-soft:#12302D;
  --ok:#5BD58A; --ok-soft:#10301D; --warn:#F0A64A; --warn-soft:#3A2810; --crit:#FF8A7D; --crit-soft:#3C1713; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;line-height:1.25} h2{font-size:19px} h3{font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;gap:10px;align-items:center;font-weight:700}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand svg{width:17px;height:17px;stroke:var(--accent-ink);fill:none;stroke-width:2.2}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 14px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:18px}

.steps{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted)}
.step b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--surface2)}
.step.on{border-color:var(--accent);color:var(--ink);font-weight:600}
.step.on b{background:var(--accent);color:var(--accent-ink)}
.step.done b{background:var(--ok);color:#fff}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.lead{color:var(--muted);margin:6px 0 0}
.grid{display:grid;gap:16px}
.cols{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}
@media(max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 18px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:13px 24px;font-size:16px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.warn{background:var(--warn-soft);color:var(--warn)}

/* brand picker */
.brands{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:18px}
.brandbtn{display:flex;flex-direction:column;gap:6px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:16px}
.brandbtn:hover{border-color:var(--muted)}
.brandbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.brandbtn b{font-size:18px}
.brandbtn span{font-size:13px;color:var(--muted)}
.rec-pic{height:46px;border-radius:6px;background:linear-gradient(#2b3432,#1c2321);display:flex;align-items:center;gap:8px;padding:0 10px;margin-bottom:6px}
.rec-pic i{width:7px;height:7px;border-radius:50%;background:#37d67a}
.rec-pic u{flex:1;height:5px;border-radius:3px;background:#46524f;text-decoration:none}

/* values card */
.vals{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.val{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface2)}
.val small{grid-column:1/-1;color:var(--muted);font-size:12.5px;font-weight:500}
.val code{font-family:var(--mono);font-size:17px;font-weight:600;overflow-wrap:anywhere}
.val button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:13px}
.val.ok{border-color:var(--ok);background:var(--ok-soft)}
.path{font-size:13.5px;background:var(--accent-soft);border-radius:8px;padding:10px 12px;margin-bottom:6px}
.path b{font-weight:600}
.check{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.check li{display:flex;gap:10px;align-items:center;color:var(--muted)}
.check .ic{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:12px;font-weight:700}
.check li.run{color:var(--ink)} .check li.run .ic{border-color:var(--accent);border-top-color:transparent;animation:spin 1s linear infinite}
.check li.done{color:var(--ink)} .check li.done .ic{background:var(--ok);border-color:var(--ok);color:#fff}
.check li.fail{color:var(--crit)} .check li.fail .ic{background:var(--crit);border-color:var(--crit);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.check li.run .ic{animation:none}}

/* simulated recorder */
.rec{border:1px solid #0d1211;border-radius:10px;overflow:hidden;background:#EDEFEE;color:#1a1f1e;font-family:Arial,Helvetica,sans-serif;font-size:13px}
.rec-top{background:#1d2523;color:#fff;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
.rec-top b{letter-spacing:.04em}
.rec-bc{padding:8px 12px;background:#dfe3e1;font-size:12px;color:#444}
.rec-body{display:grid;grid-template-columns:120px minmax(0,1fr)}
.rec-side{background:#d0d6d3;padding:8px 0;font-size:12px}
.rec-side div{padding:7px 12px;color:#333}
.rec-side div.on{background:#fff;font-weight:700;color:#0a4f48}
.rec-main{padding:14px;display:flex;flex-direction:column;gap:9px}
.rec-main label{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:center;font-size:12.5px}
.rec-main input[type=text],.rec-main select{width:100%;border:1px solid #9aa5a1;border-radius:3px;padding:5px 7px;font:inherit;background:#fff;color:#111;min-width:0}
.rec-main input.bad{border-color:#c0261b;background:#fff0ee}
.rec-main input.good{border-color:#1a8a3f}
.rec-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rec-btn{background:#2b7f76;color:#fff;border:0;border-radius:3px;padding:6px 18px;font:inherit;font-weight:700}
.rec-btn:hover{background:#236a62}
.rec-status{margin-top:4px;padding:7px 9px;border-radius:3px;background:#fff;border:1px solid #c5ccc9;font-size:12.5px}
.rec-status b.off{color:#c0261b} .rec-status b.on{color:#1a8a3f} .rec-status b.wait{color:#b36b00}
@media(max-width:520px){.rec-body{grid-template-columns:minmax(0,1fr)}.rec-side{display:none}.rec-main label{grid-template-columns:minmax(0,1fr)}}
.demo-bar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.demo-bar small{color:var(--muted);font-size:12.5px}

/* cameras */
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:16px}
.ch{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.ch.on{border-color:var(--accent)}
.ch svg{display:block;width:100%;aspect-ratio:16/9;background:#2c3532}
.ch-b{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ch-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ch-h label{display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer}
.ch input[type=text],.ch select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
.ch select[disabled],.ch input[disabled]{opacity:.5}
.sum{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}

/* done */
.finish{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center}
@media(max-width:760px){.finish{grid-template-columns:minmax(0,1fr)}}
.big-ok{width:56px;height:56px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin-bottom:12px}
.big-ok svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:3}
.next{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:10px}
.next li{display:flex;gap:10px}
.next b{display:block}
.next span{color:var(--muted);font-size:13.5px}
.phone{width:min(100%,300px);margin:0 auto;border:8px solid #1b2422;border-radius:30px;background:#E9E2D6;overflow:hidden}
.phone-h{background:#0B6B5E;color:#fff;padding:10px 12px;font-size:13px;font-weight:600}
.phone-b{padding:12px 10px;display:flex;flex-direction:column;gap:8px;min-height:330px}
.bubble{background:#fff;color:#1a1a1a;border-radius:8px;border-top-left-radius:2px;padding:8px 9px;font-size:12.5px;max-width:95%;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.bubble small{display:block;color:#7a7a7a;text-align:right;font-size:10px;margin-top:3px}

.help{margin-top:16px;border:1px dashed var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.help input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:170px}
.help .row{display:flex;gap:8px;flex-wrap:wrap}

details.log{margin-top:22px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.log summary{cursor:pointer;padding:12px 16px;font-weight:600}
.log pre{margin:0;padding:12px 16px;border-top:1px solid var(--line);font-family:var(--mono);font-size:12px;line-height:1.7;background:#0e1514;color:#bfe9df;border-radius:0 0 12px 12px;overflow-x:auto;min-height:60px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>

function nowT(){var d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())}

/* ---------- connect logic ---------- */
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function resetChecks(){S.steps.c=[1,0,0,0,0];[0,1,2,3,4].forEach(function(k){setCk(k,S.steps.c[k])})}
async function save(){
  if(S.busy||S.connected)return;
  var r=S.rec,exp=vals(),i;
  if(!r.en){r.status="dis";r.err=-1;r.msg=t("err_en");updateRec();L("recorder: Save pressed but Platform Access is not enabled");return}
  var bad=-1;for(i=0;i<4;i++){var a=(r.v[i]||"").trim(),e=exp[i];if(i===2||i===0){a=a.toLowerCase();e=e.toLowerCase()}if(a!==e){bad=i;break}}
  if(bad>-1){r.status="off";r.err=bad;r.msg=t("err_val");updateRec();L("recorder: registration attempt rejected (field "+(bad+1)+" does not match)");return}
  S.busy=true;r.err=-1;r.msg="";r.status="wait";updateRec();resetChecks();
  L("recorder: Save pressed, dialling "+r.v[0]+":"+r.v[1]);
  await sleep(900);L("registrar: inbound connection from 49.205.118.40 (dynamic IP, behind customer router)");setCk(0,2);setCk(1,1);
  await sleep(900);L("registrar: device "+r.v[2]+" key verified, session open");setCk(1,2);setCk(2,1);
  await sleep(900);L("registrar: channel list received, 8 channels (4 active)");setCk(2,2);setCk(3,1);
  await sleep(900);L("media: preview requested for channel 1, stream relay up, decoding at 5 fps");setCk(3,2);setCk(4,1);
  r.status="on";updateRec();
  await sleep(900);L("registry: recorder "+r.v[2]+" marked ONLINE, heartbeat every 30 s");setCk(4,2);
  S.connected=true;S.busy=false;
  var wn=$("#waitnote");if(wn)wn.innerHTML='<span class="pill ok">✓ '+t("connected")+'</span>';
  var n2=$("#n2");if(n2)n2.disabled=false;
  [0,1,2,3].forEach(function(k){var v=$("#val"+k);if(v)v.classList.add("ok")});
}
async function fillDemo(){
  if(S.busy||S.connected)return;
  var exp=vals(),i,j;
  var en=$("#rEn");if(en){en.checked=true;S.rec.en=true}
  for(i=0;i<4;i++){
    var f=$("#r"+i);if(!f)return;S.rec.v[i]="";f.value="";
    for(j=1;j<=exp[i].length;j++){S.rec.v[i]=exp[i].slice(0,j);f.value=S.rec.v[i];await sleep(28)}
    var cp=$("#val"+i);if(cp)cp.classList.add("ok");
    await sleep(150);
  }
  S.rec.err=-1;S.rec.msg="";updateRec();
  await sleep(500);save();
}

    render();L("registrar: listening on :"+BR[S.brand].port+" ("+BR[S.brand].proto+"), waiting for device SHARMA-001");};

    var i=+b.getAttribute("data-copy"),val=vals()[i];

  var en=$("#rEn");if(en)en.onchange=function(){S.rec.en=en.checked};
  var sv=$("#rSave");if(sv)sv.onclick=save;

    if(!S.ch.length){S.ch=T.en.cams.map(function(n,i){return {on:i<4,name:T[S.lang].cams[i],uc:i===0?"foot":i===1?"plate":"none"}})}
    S.step=3;render()};
  v.querySelectorAll("[data-ch]").forEach(function(c){c.onchange=function(){var i=+c.getAttribute("data-ch");S.ch[i].on=c.checked;if(c.checked&&S.ch[i].uc==="none")S.ch[i].uc="foot";render()}});
  v.querySelectorAll("[data-name]").forEach(function(c){c.oninput=function(){S.ch[+c.getAttribute("data-name")].name=c.value}});
  v.querySelectorAll("[data-uc]").forEach(function(c){c.onchange=function(){S.ch[+c.getAttribute("data-uc")].uc=c.value;updateSum()}});
  var b3=$("#b3");if(b3)b3.onclick=function(){S.step=2;render()};
