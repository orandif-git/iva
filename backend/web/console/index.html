<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Jas iVision Control Center</title>
<link rel="manifest" href="/console/manifest.webmanifest">
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A2029" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="iVision">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="stylesheet" href="/console/console.css">
<link rel="stylesheet" href="/console/phone.css" media="(max-width: 760px)">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-l">
      <button class="pback" id="pback" type="button" data-go="customers" aria-label="Back to all customers" hidden></button>
      <button class="logo" id="home" type="button" aria-label="Jas iVision, go to Overview"><img src="/console/logo-compact.svg" alt="Jas iVision"></button>
      <nav class="areas" id="areas" aria-label="Areas"></nav>
    </div>
    <h1 class="ptitle" id="ptitle"></h1>
    <div class="ttl" aria-label="Jas iVision Control Center"><b class="ttl-j">JAS</b> <i>iVision</i> Control Center</div>
    <div class="top-r">
      <div class="lights" id="lights" role="group" aria-label="System status"></div>
      <button class="ibtn" id="theme" type="button" aria-label="Switch light or dark"></button>
      <div class="me"><button class="meb" id="meb" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="pop" aria-label="My profile"><span class="role" id="role"></span><span class="av" id="av"></span></button><div class="pfp" id="pop" role="dialog" aria-label="My profile" hidden></div></div>
    </div>
  </header>
  <div class="lpop" id="lpop" role="dialog" aria-label="Status details" hidden></div>
  <div class="main">
    <nav class="rail" id="rail" aria-label="Sections"></nav>
    <aside class="side" id="side" hidden></aside>
    <main class="page" id="page"></main>
  </div>
</div>
<div id="layer"></div>
<nav class="tabbar" id="tabbar" aria-label="Main"><span class="pill" id="pill"></span></nav>
<noscript><p class="noscript">Please turn on JavaScript to use this page.</p></noscript>
<script type="module" src="/console/app.js"></script>
</body>
</html>
