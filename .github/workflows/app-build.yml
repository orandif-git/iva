# Builds the Jas iVision phone apps on GitHub's machines (this server has no Android or Apple tooling). Run it by hand: Actions, "Build phone apps", Run workflow.
# Nothing is uploaded to a store; you download the files from the finished run. Steps and one-time setup: docs/MOBILE.md.
name: Build phone apps

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Your server address, for example https://app.yourcompany.in (no slash at the end)"
        required: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Upload key (only if you added one as a secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload.jks
            printf 'storeFile=../upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          else
            echo "No upload key secret: the build is signed with the debug key (fine for trying the app, not for Google Play)."
          fi
      - run: flutter build apk --release --dart-define=API_BASE=${{ inputs.api_base }}
      - run: flutter build appbundle --release --dart-define=API_BASE=${{ inputs.api_base }}
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - run: flutter pub get
      - name: Build without signing (proves the iPhone app compiles; the signed build for TestFlight needs your Apple account, see docs/MOBILE.md)
        run: flutter build ios --release --no-codesign --dart-define=API_BASE=${{ inputs.api_base }}
